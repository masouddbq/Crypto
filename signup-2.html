<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>کاسموس — ثبت‌نام دو</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="signup2">
  <div class="stars"></div>
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <div class="wrap split">
        <div>
          <div class="trust" style="justify-content:flex-start">
            <div class="faces"><span class="face">🧑</span><span class="face">👩</span><span class="face plus">+</span></div>
            <p>مورد اعتماد بیش از <strong>۱۵۰۰ کاربر</strong></p>
          </div>
          <h1 style="margin-inline-start:0;font-size:64px">ثبت‌نام</h1>
          <div class="card" style="margin-top:24px">
            <h3 style="font-weight:500">«کار با قالب کاسموس از اول تا آخر روان بود»</h3>
            <div class="person" style="justify-content:start;grid-auto-flow:column;gap:10px;margin-top:16px"><span class="face">🧔</span><div><b>جان دو</b><span>مدیرعامل سایت‌مارک</span></div></div>
          </div>
        </div>
        <form class="form-card" data-form>
          <h3 style="margin-top:0">اینجا ثبت‌نام کنید</h3>
          <div class="socials">
            <button class="btn btn-ghost" type="button">گوگل &nbsp; ورود</button>
            <button class="btn btn-ghost" type="button">▶</button>
            <button class="btn btn-ghost" type="button">𝕏</button>
          </div>
          <div class="or">یا</div>
          <div class="two"><input placeholder="نام" required /><input placeholder="نام خانوادگی" required /></div>
          <div style="height:8px"></div>
          <input type="email" placeholder="ایمیل" required />
          <label class="checks" style="margin:12px 0"><input type="checkbox" required style="width:auto" /> با سیاست حریم خصوصی موافقم</label>
          <button class="btn btn-white btn-wide" type="submit">ثبت‌نام</button>
          <p class="ok">ممنون! پیام شما دریافت شد.</p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
</body>
</html>
