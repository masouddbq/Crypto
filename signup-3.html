<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>کاسموس — ثبت‌نام سه</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="signup3">
  <div class="stars"></div>
  <div id="site-header"></div>
  <main>
    <section class="hero">
      <div class="vlines"><i></i><i></i><i></i><i></i></div>
      <div class="wrap split" style="position:relative">
        <div>
          <div class="trust" style="justify-content:flex-start"><div class="faces"><span class="face">🧑</span><span class="face">👩</span><span class="face plus">+</span></div><p>مورد اعتماد بیش از <strong>۱۵۰۰ کاربر</strong></p></div>
          <h1 style="margin-inline-start:0">همین حالا با <span class="grad">کاسموس</span> رشد کنید.</h1>
          <p class="sub" style="margin-inline-start:0">وارد دنیایی شوید که فناوری دقیقاً گرد نیازهای شما می‌چرخد.</p>
          <div class="actions" style="justify-content:flex-start">
            <a class="btn btn-white" href="pricing.html">مشاهده قیمت‌ها</a>
            <a class="btn btn-ghost" href="docs.html">خواندن مستندات</a>
          </div>
        </div>
        <form class="form-card" data-form>
          <div class="toggle" id="mode" style="margin-top:0">
            <button type="button" class="on" data-mode="up">ثبت‌نام</button>
            <button type="button" data-mode="in">ورود</button>
          </div>
          <div class="socials" style="margin-top:12px">
            <button class="btn btn-ghost" type="button">گوگل &nbsp; ادامه</button>
            <button class="btn btn-ghost" type="button">▶</button>
            <button class="btn btn-ghost" type="button">𝕏</button>
          </div>
          <div class="or">یا</div>
          <input id="nameField" placeholder="نام" required />
          <div style="height:8px"></div>
          <input type="email" placeholder="ایمیل" required />
          <div style="height:8px"></div>
          <input type="password" placeholder="گذرواژه" required />
          <label class="checks" style="margin:12px 0"><input type="checkbox" style="width:auto" /> با سیاست حریم خصوصی موافقم</label>
          <button class="btn btn-white btn-wide" id="submitLabel" type="submit">ثبت‌نام</button>
          <p class="ok">ممنون! پیام شما دریافت شد.</p>
        </form>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
</body>
</html>
